<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Small Arena</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:400px;
    background:white;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.logo{
    font-size:60px;
    margin-bottom:10px;
}

h1{
    color:#111827;
    margin-bottom:10px;
}

.tagline{
    color:#6b7280;
    margin-bottom:30px;
}

.btn{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.login{
    background:#2563eb;
    color:white;
}

.register{
    background:#16a34a;
    color:white;
}

.btn:hover{
    transform:scale(1.03);
}

.footer{
    margin-top:25px;
    color:#9ca3af;
    font-size:14px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">🎲</div>

    <h1>BIG SMALL ARENA</h1>

    <p class="tagline">
        Choose Big or Small and test your luck!
    </p>

    <button class="btn login"
    onclick="window.location.href='login.html'">
        Login
    </button>

    <button class="btn register"
    onclick="window.location.href='register.html'">
        Register
    </button>

    <div class="footer">
        Version 1.0
    </div>

</div>

</body>
</html>
